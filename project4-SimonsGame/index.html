<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 class="title">Simon <span class="accent">Game</span></h1>
    <h2 id="status">Press START to begin the Game!</h2>

    <div class="game-wrap">
        <div class="btn-container">
            <div class="line1">
                <div class="btn red" data-color="red" type="button">1</div>
                <div class="btn green" data-color="green" type="button">2</div>
            </div>
            <div class="line2">
                <div class="btn yellow" data-color="yellow" type="button">3</div>
                <div class="btn blue" data-color="blue" type="button">4</div>
            </div>
        </div>

        <!-- center hub -->
        <div class="hub">
            <div class="hub-score">
                <span class="hub-label">Score</span>
                <span id="score">0</span>
            </div>
            <button id="startBtn">▶ Start</button>
            <div class="hub-score">
                <span class="hub-label">Best</span>
                <span id="highScore">0</span>
            </div>
        </div>
    </div>

    <p id="hint">Click the buttons to match the sequence. How far can you go?</p>

    <!-- Game over overlay -->
    <div id="gameOver" class="overlay hidden">
        <div class="overlay-card">
            <h1 class="gameover-title">Game Over</h1>
            <p>You reached <span id="finalScore">0</span> points!</p>
            <p class="best-line">Best: <span id="finalBest">0</span></p>
            <button id="restartBtn">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
